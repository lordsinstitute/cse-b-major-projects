<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><title>SecureAuthX E2E — sign-up form</title></head>
<body>
  <h1>Sign-up form: the only password field is a NEW password</h1>
  <form onsubmit="return false">
    <input type="email" id="email" autocomplete="username" />
    <input type="password" id="pwNew" autocomplete="new-password" />
  </form>
</body></html>
