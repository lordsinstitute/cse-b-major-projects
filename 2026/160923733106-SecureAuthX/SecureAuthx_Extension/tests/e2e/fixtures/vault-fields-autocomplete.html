<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><title>SecureAuthX E2E — autocomplete hints</title></head>
<body>
  <h1>Password fields that declare their role</h1>
  <form onsubmit="return false">
    <input type="text" id="user" autocomplete="username" />
    <input type="password" id="pwCurrent" autocomplete="current-password" />
    <input type="password" id="pwNew" autocomplete="new-password" />
    <input type="password" id="pwConfirm" autocomplete="new-password" />
  </form>
</body></html>
