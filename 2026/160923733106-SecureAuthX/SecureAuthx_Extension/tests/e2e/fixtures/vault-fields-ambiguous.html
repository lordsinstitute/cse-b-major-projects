<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><title>SecureAuthX E2E — ambiguous password fields</title></head>
<body>
  <h1>Change-password form (three password fields, no hints)</h1>
  <form onsubmit="return false">
    <input type="text" name="username" id="user" />
    <input type="password" id="pw1" placeholder="Current password" />
    <input type="password" id="pw2" placeholder="New password" />
    <input type="password" id="pw3" placeholder="Confirm new password" />
  </form>
</body></html>
