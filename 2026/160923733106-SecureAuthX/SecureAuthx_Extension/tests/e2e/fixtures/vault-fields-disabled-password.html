<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><title>SecureAuthX E2E — no usable password field</title></head>
<body>
  <h1>Only disabled / read-only password fields</h1>
  <form onsubmit="return false">
    <input type="email" id="user" autocomplete="username" />
    <input type="password" id="disabledPassword" disabled />
    <input type="password" id="readonlyPassword" readonly />
  </form>
</body></html>
