<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><title>SecureAuthX E2E — disabled / read-only username</title></head>
<body>
  <h1>Disabled and read-only username fields, usable password</h1>
  <form onsubmit="return false">
    <input type="text" name="username" id="disabledUser" disabled />
    <input type="text" name="email" id="readonlyUser" readonly />
    <input type="password" id="realPassword" />
  </form>
</body></html>
