name: soul_care
description: "SoulCare - A private, local-first personal wellness and health organization application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.1

  # Local persistence (ONE solution: Hive - structured objects, lists, CRUD, restart persistence)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0

  # Small preferences only
  shared_preferences: ^2.3.2

  # File handling
  file_picker: ^8.1.2

  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  pdfrx: ^2.4.7
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  share_plus: ^12.0.2
  local_auth: ^3.0.2
  archive: ^4.3.0
  health: ^13.3.1
  home_widget: ^0.10.0
  speech_to_text: ^7.4.0
  qr_flutter: ^4.1.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  flutter_secure_storage: ^10.3.4
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
